<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clearview Solitaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@700;800&family=Poiret+One&display=swap" rel="stylesheet">
  <link rel="icon" href="../shared/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/table.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="hud">
    <a class="brand" href="../" title="All games">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>Clearview</h1>
        <span class="tagline">Open-hand solitaire</span>
      </div>
    </a>

    <div class="stats">
      <div class="stat"><b id="wins">0</b><span>Wins</span></div>
      <div class="stat"><b id="moves">0</b><span>Moves</span></div>
      <div class="stat"><b id="time">0:00</b><span>Time</span></div>
    </div>

    <nav class="actions">
      <a class="btn" href="../" title="Back to all games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Games</span>
      </a>
      <button id="btn-auto" class="btn gold hidden" title="Send every card home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span>Auto-finish</span>
      </button>
      <button id="btn-new" class="btn" title="New game (N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="12" height="15" rx="2"/><path d="M8.5 7V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-3"/></svg>
        <span>New</span>
      </button>
      <button id="btn-undo" class="btn" title="Undo (Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span>Undo</span>
      </button>
      <button id="btn-hint" class="btn" title="Hint (H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
        <span>Hint</span>
      </button>
      <button id="btn-rules" class="btn" title="Rules (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
        <span>Rules</span>
      </button>
      <button id="btn-settings" class="btn" title="Settings (S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </header>

  <main id="table">
    <div id="board"></div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="modal" class="modal hidden">
    <div class="panel" role="dialog" aria-modal="true"></div>
  </div>

  <script src="../shared/daily-table.js"></script>
  <script src="../shared/daily.js"></script>
  <script src="../shared/engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
